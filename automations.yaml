        position: top-right
        fontsize: medium
        color: black
        transparency: 50%
        icon:
          path: /config/www/icons/bed.png
    action: notify.sony_tv
  - repeat:
      count: 3
      sequence:
      - target:
          entity_id:
          - light.front_yard_lights_group
