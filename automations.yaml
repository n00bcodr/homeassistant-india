      entity_id:
      - switch.downstairs_motor_switch_1
      - switch.upstairs_motor
  - service: tts.google_translate_say
    data:
      entity_id: media_player.family_room_mini
      message: ట్యాంక్ నిండుగ ఉంది
      language: te
  - service: tts.google_translate_say
    data:
      entity_id: media_player.akashavani
      message: ట్యాంక్ నిండుగ ఉంది
