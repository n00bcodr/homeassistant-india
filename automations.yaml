- id: sunset
  alias: "\U0001F4A1Sunset"
  description: Turns on various lights at sunset.
  triggers:
  - event: sunset
    trigger: sun
  conditions: []
  actions:
  - parallel:
    - action: light.turn_on
      target:
        entity_id:
        - light.first_floor_stairway
        - light.first_floor_light
        - light.first_floor_corner
        - light.second_floor_stairway
        - light.second_floor_light
        - light.second_floor_corner
        - light.front_yard_lights_group
        - light.hall_tube_light
      data:
        color_temp_kelvin: 6500
        brightness_pct: 100
    - data:
        message: Turning on the front yard lights.
        title: "Good Evening \U0001F307"
        data:
          tag: sunset
          notification_icon: mdi:weather-sunset
          color: '#f5c905'
          icon_url: /local/icons/sunset.png
      action: notify.phones
    - data:
        message: Turning on the front yard lights.
        title: "Good Evening \U0001F307"
        data:
          duration: 6
          position: top-right
          fontsize: medium
          color: black
          transparency: 50%
          icon:
            path: /config/www/icons/sunset.png
      action: notify.sony_tv
  - delay:
      hours: 0
      minutes: 0
      seconds: 30
      milliseconds: 0
  - if:
    - condition: template
      value_template: '{{ not ((is_state(''light.first_floor_light'', ''on'') or is_state(''light.first_floor_stairway'',
        ''on'')) or (is_state(''light.second_floor_light'', ''on'') or is_state(''light.second_floor_stairway'',
        ''on''))) }}'
    then:
    - data:
        title: అన్ని లైట్లు వెలగడం లేదు
        message: "\U0001F504 Retrying...."
        data:
          tag: sunset
      action: notify.phones
    - repeat:
        count: 2
        sequence:
        - action: light.turn_on
          target:
            entity_id:
            - light.front_yard_lights_group
          data:
            kelvin: 6500
            brightness_pct: 100
  - delay:
      hours: 0
      minutes: 0
      seconds: 15
      milliseconds: 0
  - if:
    - condition: template
      value_template: '{{ not ((is_state(''light.first_floor_light'', ''on'') or is_state(''light.first_floor_stairway'',
        ''on'')) or (is_state(''light.second_floor_light'', ''on'') or is_state(''light.second_floor_stairway'',
        ''on''))) }}'
    then:
    - data:
        title: ⚠️ ఎదో లైట్ switch off చేసి ఉంది  ⚠️
        message: '{{ expand(''light.front_yard_lights_group'') | selectattr(''state'',
          ''eq'', ''unavailable'') | rejectattr(''entity_id'', ''in'', [''light.second_floor_corner'',
          ''light.first_floor_corner'']) | map(attribute=''name'') | list }} switch
          off చేసి ఉంది'
        data:
          notification_icon: mdi:lightbulb-alert
          tag: sunset
          persistent: true
          actions:
          - action: URI
            title: Open Lights
            uri: /lovelace/front-yard
      action: notify.phones
  mode: single
