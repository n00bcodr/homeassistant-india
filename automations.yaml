- id: '1758454475206'
  alias: F1 Track Light
  triggers:
  - entity_id:
    - sensor.f1_session_status
    - sensor.f1_track_status
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: sensor.f1_session_status
          state: live
        - condition: state
          entity_id: sensor.f1_session_status
          state: pre
      sequence:
      - choose:
        - conditions:
          - condition: state
            entity_id: sensor.f1_track_status
            state: CLEAR
          sequence:
          - target:
              entity_id: light.top_light
            data:
              color_name: green
            action: light.turn_on
        - conditions:
          - condition: state
            entity_id: sensor.f1_track_status
            state: YELLOW
          sequence:
          - target:
              entity_id: light.top_light
            data:
              color_name: yellow
            action: light.turn_on
        - conditions:
          - condition: or
            conditions:
            - condition: state
              entity_id: sensor.f1_track_status
              state: VSC
            - condition: state
              entity_id: sensor.f1_track_status
              state: SC
          sequence:
          - target:
              entity_id: light.top_light
            data:
              color_name: yellow
              flash: short
            action: light.turn_on
        - conditions:
          - condition: state
            entity_id: sensor.f1_track_status
            state: RED
          sequence:
          - target:
              entity_id: light.top_light
            data:
              color_name: red
            action: light.turn_on
    - conditions:
      - condition: not
        conditions:
        - condition: state
          entity_id: sensor.f1_session_status
          state: live
      sequence:
      - target:
          entity_id: light.top_light
        action: light.turn_off
  mode: restart
