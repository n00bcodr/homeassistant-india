- &id001
  id: system_notify_on_low_voltage
  alias: 'System: Voltage Alerts'
  description: Sends a notification if any voltage sensor drops below 200V or rises
    above 250V
  triggers:
  - entity_id:
    - sensor.downstairs_geyser_voltage
    - sensor.rice_string_voltage
    - sensor.washing_machine_1_voltage
    - sensor.washing_machine_2_voltage
    - sensor.workstation_voltage
    below: 200
    id: low
    trigger: numeric_state
  - entity_id:
    - sensor.downstairs_geyser_voltage
    - sensor.rice_string_voltage
    - sensor.washing_machine_1_voltage
    - sensor.washing_machine_2_voltage
    - sensor.workstation_voltage
    above: 300
    id: high
    trigger: numeric_state
  actions:
  - data:
      title: '{% if trigger.id == ''low'' %}⚡ Voltage Low Alert{% elif trigger.id
        == ''high'' %}⚡ Voltage High Alert{% endif %}

        '
      message: '{{ trigger.to_state.name }} is at {{ trigger.to_state.state }}{{ trigger.to_state.attributes.unit_of_measurement
        }}

        '
    action: notify.mobile_app_pixel
  mode: single
