---
button_card_templates:
  app_launcher:
    aspect_ratio: 21/9
    entity_picture: "[[[ \n  const icon = variables.app_icon || variables.app_name.toLowerCase().replace(/\
      \ /g, '');\n  return `/local/icons/${icon}.png`;\n]]]\n"
    hold_action:
      action: none
    layout: vertical
    show_entity_picture: true
    show_label: false
    show_name: false
    show_state: false
    styles:
      card:
      - border-radius: 10px
      - border: solid 0.5px var(--primary-color)
      - box-shadow: none
      - padding: 0px 0px
      - margin: 0px
      - background-color: '[[[ return variables.card_color || ''rgba(0, 0, 0, 0)'';
          ]]]'
      entity_picture:
      - width: '[[[ return variables.icon_width || ''55%''; ]]]'
    tap_action:
      action: call-service
      service: media_player.play_media
      service_data:
        media_content_id: '[[[ return variables.media_id || variables.app_name; ]]]'
        media_content_type: app
      target:
        entity_id: '[[[ return variables.target_player || ''media_player.sony_bravia_tv'';
          ]]]'
kiosk_mode:
  admin_settings:
    hide_sidebar: false
  hide_sidebar: '[[[ !user_is_admin ]]]'
  kiosk: '[[[ is_state("input_boolean.kiosk_mode", "on") ]]]'
views:
- cards: []
  dense_section_placement: true
  icon: mdi:home
  max_columns: 3
  path: home
  sections:
  - cards:
    - cards:
      - card_mod:
          style:
            .: "ha-card {\n  background: transparent !important;\n  border: 0px !important;\n\
              \  align-items: center;\n}\nmushroom-badge-icon {\n  display: none;\n\
              }\n"
            mushroom-shape-avatar$: ".container {\n  --icon-size: 150px;\n    {% if\
              \ is_state(config.entity, 'not_home') %}\n       filter: brightness(60%)\
              \ grayscale(90%) blur(2px);\n    {%- else -%}\n    {%- endif %}\n}\n"
        entity: person.murthy
        icon_type: entity-picture
        primary_info: none
        secondary_info: none
        tap_action:
          action: more-info
        type: custom:mushroom-person-card
      - card_mod:
          style:
            .: "ha-card {\n  background: transparent !important;\n  border: 0px !important;\n\
              \  align-items: center;\n}\nmushroom-badge-icon {\n  display: none;\n\
              }\n"
            mushroom-shape-avatar$: ".container {\n  --icon-size: 150px;\n    {% if\
              \ is_state(config.entity, 'not_home') %}\n       filter: brightness(60%)\
              \ grayscale(90%) blur(2px);\n    {%- else -%}\n    {%- endif %}\n}\n"
        entity: person.kameswari
        icon_type: entity-picture
        primary_info: none
        secondary_info: none
        tap_action:
          action: more-info
        type: custom:mushroom-person-card
      type: horizontal-stack
    - cards:
      - card_mod:
          style:
            .: "ha-state-icon {\n  animation: scan 5s ease-in-out infinite;\n  transform-origin:\
              \ 70% 70%\n}\n@keyframes scan {\n  0%, 100% { transform: rotate(10deg);\
              \ }\n  50% { transform: rotate(-10deg); }\n}\n"
            mushroom-shape-icon$: ".shape {\n  --icon-symbol-size: 100px;\n  --icon-size:\
              \ 120px;\n  }\n"
        icon: mdi:cctv
        icon_color: blue-grey
        tap_action:
          action: navigate
          navigation_path: /lovelace-wallmount/camera
        type: custom:mushroom-legacy-template-card
