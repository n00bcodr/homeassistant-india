---
button_card_templates:
  blank_button:
    aspect_ratio: 4/3
    color_type: icon
    hold_action:
      action: none
    layout: vertical
    show_label: false
    show_name: false
    show_state: false
    styles:
      card:
      - border-radius: 0px
      - border: solid 0px var(--primary-color)
      - box-shadow: none
      - padding: 6px 6px
      - margin: 0px 0px
      - --paper-card-background-color: rgba(0, 0, 0, 0)
      icon:
      - width: 28px
      name:
      - justify-self: middle
      - align-self: end
      - font-size: 14px
      - padding: 0px 0px
      - color: var(--secondary-text-color)
    tap_action:
      action: none
  icon_button:
    aspect_ratio: 4/3
    color_type: card
    hold_action:
      action: none
    layout: vertical
    show_label: false
    show_name: false
    show_state: false
    styles:
      card:
      - border-radius: 10px
      - border: solid 1px var(--primary-color)
      - box-shadow: none
      - padding: 6px 6px
      - margin: 0px 0px
      - --paper-card-background-color: rgba(0, 0, 0, 0)
      icon:
      - width: 28px
      name:
      - justify-self: middle
      - align-self: end
      - font-size: 14px
      - padding: 0px 0px
      - color: var(--secondary-text-color)
    tap_action:
      action: call-service
  list_button:
    aspect_ratio: 5/1
    color_type: icon
    layout: vertical
    show_entity_picture: true
    show_name: true
    show_state: false
    styles:
      card:
      - border-radius: 15px
      - border: solid 0.1px var(--primary-color)
      - box-shadow: none
      - padding: 0px 0px
      - margin: 0px 0px
      - background-size: cover
      - --paper-card-background-color: rgba(0, 0, 0, 0)
      name:
      - justify-self: middle
      - align-self: middle
      - font-size: 20px
      - padding: 0px 0px
      - color: var(--secondary-text-color)
    tap_action:
      action: call-service
  logo_button:
    aspect_ratio: 21/9
    color: rgb(255,255,255)
    color_type: card
    hold_action:
      action: none
    layout: vertical
    show_label: false
    show_name: false
    show_state: false
    styles:
      card:
      - border-radius: 5px
      - border: solid 0.5px var(--primary-color)
      - box-shadow: none
      - padding: 0px 0px
      - margin: 0px 0px
      - --paper-card-background-color: rgba(0, 0, 0, 0)
      icon:
      - width: 50px
      name:
      - justify-self: middle
      - align-self: end
      - font-size: 14px
      - padding: 0px 0px
      - color: var(--secondary-text-color)
    tap_action:
      action: call-service
  menu_button:
    aspect_ratio: 4/3
    color_type: icon
    hold_action:
      action: none
    layout: vertical
    show_label: false
    show_name: false
    show_state: false
    styles:
      card:
      - border-radius: 10px
      - border: solid 1px var(--primary-color)
      - box-shadow: none
      - padding: 6px 6px
      - margin: 0px 0px
      - --paper-card-background-color: rgba(0, 0, 0, 0)
      icon:
      - width: 28px
      name:
      - justify-self: middle
      - align-self: end
      - font-size: 14px
      - padding: 0px 0px
      - color: var(--secondary-text-color)
    tap_action:
      action: call-service
kiosk_mode:
  admin_settings:
    ignore_entity_settings: true
  entity_settings:
  - entity:
      input_boolean.kiosk_mode: 'on'
    kiosk: true
views:
- cards: []
  icon: mdi:home
  max_columns: 3
  path: '0'
  sections:
  - cards:
    - cards:
      - aspect_ratio: 1/1
        entity: person.murthy
        image: /local/images/murthy.jpg
        name: Murthy
        show_name: false
        show_state: false
        state_filter:
          not_home: brightness(60%) grayscale(90%) blur(2px)
        type: picture-entity
      - aspect_ratio: 1/1
        entity: person.kameswari
        image: /local/images/kameswari.jpg
        show_name: false
        show_state: false
        state_filter:
          not_home: brightness(60%) grayscale(90%) blur(2px)
        type: picture-entity
      type: horizontal-stack
    - cards:
      - card_mod:
          style:
            .: "ha-state-icon {\n  animation: scan 5s ease-in-out infinite;\n  transform-origin:\
              \ 70% 70%\n}\n@keyframes scan {\n  0%, 100% { transform: rotate(10deg);\
              \ }\n  50% { transform: rotate(-10deg); }\n}\n"
            mushroom-shape-icon$: ".shape {\n  --icon-symbol-size: 100px;\n  --icon-size:\
              \ 120px;\n  }\n"
        icon: mdi:cctv
        icon_color: blue-grey
        type: custom:mushroom-template-card
      - card_mod:
          style:
            .: "ha-card {\n  {% if is_state(config.entity, 'TankFull') %}\n  background:\
              \ url('/local/icons/wave.png');\n  background-size: 80% 100%;\n  background-repeat:\
              \ repeat-x;\n  animation: bgScroll 1s linear infinite;\n  {% endif %}\n\
              }\n@keyframes bgScroll {\n  from {\n    background-position: 0 0;\n\
              \  }\n  to {\n    background-position: -100% 0%;\n  }\n}\n"
            mushroom-shape-icon$: ".shape {\n  {% if is_state(config.entity, 'TankFull')\
              \ %}\n  --icon-symbol-size: 90px;\n  --icon-size: 0px; \n  {% else %}\n\
              \  --icon-symbol-size: 80px;\n  --icon-size: 100px; \n  {% endif %}\n\
              }\n"
            mushroom-state-info$: ".container {\n --card-primary-font-size: 20px;\n\
              }\n"
        entity: sensor.motor_state
        fill_container: true
        hold_action:
          action: navigate
          navigation_path: /lovelace-wallmount/motors
        icon: "{% if is_state(config.entity, 'Upstairs') %}\n  mdi:numeric-2-box-outline\n\
          {% elif is_state(config.entity, 'Downstairs') %}\n  mdi:numeric-1-box-outline\n\
          {% elif is_state(config.entity, 'MotorsOff') %}\n  mdi:water-pump-off\n\
          {% elif is_state(config.entity, 'TankFull') %}\n  mdi:water-pump\n{% endif\
          \ %}"
        icon_color: "{% if is_state(config.entity, 'Upstairs') %}\n  blue\n{% elif\
          \ is_state(config.entity, 'Downstairs') %}\n  pink\n{% elif is_state(config.entity,\
          \ 'MotorsOff') %}\n  lightgrey\n{% elif is_state(config.entity, 'TankFull')\
          \ %}\n  black\n{% endif %}"
        layout: vertical
        primary: "{% if is_state(config.entity, 'Upstairs') %}\n  Upstairs\n{% elif\
          \ is_state(config.entity, 'Downstairs') %}\n  Downstairs\n{% else %}\n{%\
          \ endif %}"
        tap_action:
          action: navigate
          navigation_path: /lovelace-wallmount/motors
        type: custom:mushroom-template-card
      - card_mod:
          style:
            .: ":host {\n  --mush-icon-size: 100px;\n}\n"
            mushroom-shape-avatar$: ".picture {\n  {% if is_state(config.entity, 'on')\
              \ %}\n  filter: brightness(1) contrast(3);\n  {% else %}\n  filter:\
              \ grayscale(50%) opacity(40%);\n  {% endif %}        \n}\n"
            mushroom-state-info$: ".container {\n --card-primary-font-size: 20px;\n\
              }\n"
        entity: switch.downstairs_geyser
        fill_container: true
        icon_color: ''
        layout: vertical
        picture: /local/icons/geyser.png
        primary: "{% if is_state(config.entity, 'on') %}\n  On\n{% else %}\n{% endif\
          \ %}"
        tap_action:
          action: toggle
        type: custom:mushroom-template-card
      type: horizontal-stack
    - cards:
      - camera_view: live
        entity: image.front_yard_camera_person
        show_state: false
        type: picture-entity
      - camera_view: live
        entity: image.second_floor_camera_person
        show_name: true
        show_state: false
        type: picture-entity
      type: horizontal-stack
    - badge_color: '{{ ''deep-orange'' if ''AM'' in states(''sensor.ireland_time'')
        else ''grey'' }}'
      badge_icon: '{{ ''mdi:weather-sunny'' if ''AM'' in states(''sensor.ireland_time'')
        else ''mdi:weather-night'' }}'
      card_mod:
        style:
          .: "ha-card {\n  --card-primary-font-size: 30px;\n  background: transparent\
            \ !important;\n}\nmushroom-badge-icon {\n  --badge-icon-size: 20px;\n\
            \  --badge-size: 25px;\n}\n"
          mushroom-shape-avatar$: ".container {\n  --icon-size: 55px;       \n}\n"
          mushroom-state-info$: ".primary {\n  overflow: visible !important;\n}\n"
      double_tap_action:
        action: none
      fill_container: true
      grid_options:
        columns: 6
        rows: 3
      hold_action:
        action: none
      icon: ''
      layout: vertical
      multiline_secondary: false
      picture: /local/icons/ire.png
      primary: '{{states.sensor.ireland_time.state}}'
      tap_action:
        action: none
      type: custom:mushroom-template-card
    - badge_color: '{{ ''deep-orange'' if ''AM'' in states(''sensor.canada_time'')
        else ''grey'' }}'
      badge_icon: '{{ ''mdi:weather-sunny'' if ''AM'' in states(''sensor.canada_time'')
        else ''mdi:weather-night'' }}'
      card_mod:
        style:
          .: "ha-card {\n  --card-primary-font-size: 30px;\n  background: transparent\
            \ !important;\n}\nmushroom-badge-icon {\n  --badge-icon-size: 20px;\n\
            \  --badge-size: 25px;\n}\n"
          mushroom-shape-avatar$: ".container {\n  --icon-size: 55px;       \n}\n"
          mushroom-state-info$: ".primary {\n  overflow: visible !important;\n}\n"
      double_tap_action:
        action: none
      fill_container: true
      grid_options:
        columns: 6
        rows: 3
      hold_action:
        action: none
      icon: ''
      layout: vertical
      multiline_secondary: false
      picture: /local/icons/can.png
      primary: '{{states.sensor.canada_time.state}}'
      tap_action:
        action: none
      type: custom:mushroom-template-card
    type: grid
  - cards:
    - cards:
      - color_type: blank-card
        styles:
          card:
          - width: 10px
        type: custom:button-card
      - color: transparent
        color_type: label-card
        entity: input_select.room_select
        name: Living Room
        show_name: true
        state:
        - icon: mdi:television
          styles:
            icon:
            - color: white
            - width: 50px
            name:
            - color: white
            - font-size: 12px
            - padding-top: 5px
          value: LivingRoom
        - icon: mdi:television
          operator: default
          styles:
            icon:
            - color: white
            - opacity: 0.2
            - width: 45px
            name:
            - color: white
            - font-size: 12px
            - padding-top: 5px
        tap_action:
          action: call-service
          service: input_select.select_option
          service_data:
            entity_id: input_select.room_select
            option: LivingRoom
        type: custom:button-card
