            \ 'on') %}\n    background: #2a5629 !important;\n  {%else%}\n     background:\
            \ disabled !important;\n  {% endif %}\n}\n:host {\n  --mush-icon-size:\
            \ 180px;\n}\n"
          mushroom-shape-icon$: ".shape {\n  position: relative;\n  background: none\
            \ !important;\n  top: -30px;\n  left: -20px;\n}\n"
          mushroom-state-info$: ".primary {\n  font-size: 20px !important;\n  position:\
            \ relative;\n  top: 60px;\n  left: -180px;\n  overflow: visible !important;\n\
            }\n.secondary {\n  font-size: 12px !important;\n  position: relative;\n\
            \  overflow: visible !important;\n  top: 70px;\n  left: -180px;\n}\n"
      double_tap_action:
        action: toggle
      entity: light.front_yard_lights_group
      grid_options:
        columns: 6
        rows: 200px
      hold_action:
        action: toggle
      name: Front Yard Lights
      tap_action:
        action: toggle
