button_card_templates:
  blank_button:
    aspect_ratio: 4/3
    color_type: icon
    hold_action:
      action: none
    layout: vertical
    show_label: false
    show_name: false
    show_state: false
    styles:
      card:
      - border-radius: 0px
      - border: solid 0px var(--primary-color)
      - box-shadow: none
      - padding: 6px 6px
      - margin: 0px 0px
      - --paper-card-background-color: rgba(0, 0, 0, 0)
      icon:
      - width: 28px
      name:
      - justify-self: middle
      - align-self: end
      - font-size: 14px
      - padding: 0px 0px
      - color: var(--secondary-text-color)
    tap_action:
      action: none
  icon_button:
    aspect_ratio: 4/3
    color_type: card
    hold_action:
      action: none
    layout: vertical
    show_label: false
    show_name: false
    show_state: false
    styles:
      card:
      - border-radius: 10px
      - border: solid 1px var(--primary-color)
      - box-shadow: none
      - padding: 6px 6px
      - margin: 0px 0px
      - --paper-card-background-color: rgba(0, 0, 0, 0)
      icon:
      - width: 28px
      name:
      - justify-self: middle
      - align-self: end
      - font-size: 14px
      - padding: 0px 0px
      - color: var(--secondary-text-color)
    tap_action:
      action: call-service
  list_button:
    aspect_ratio: 5/1
    color_type: icon
    layout: vertical
    show_entity_picture: true
    show_name: true
    show_state: false
    styles:
      card:
      - border-radius: 15px
      - border: solid 0.1px var(--primary-color)
      - box-shadow: none
      - padding: 0px 0px
      - margin: 0px 0px
      - background-size: cover
      - --paper-card-background-color: rgba(0, 0, 0, 0)
      name:
      - justify-self: middle
      - align-self: middle
      - font-size: 20px
      - padding: 0px 0px
      - color: var(--secondary-text-color)
    tap_action:
      action: call-service
  logo_button:
    aspect_ratio: 21/9
    color: rgb(255,255,255)
    color_type: card
    hold_action:
      action: none
    layout: vertical
    show_label: false
    show_name: false
    show_state: false
    styles:
      card:
      - border-radius: 5px
      - border: solid 0.5px var(--primary-color)
      - box-shadow: none
      - padding: 0px 0px
      - margin: 0px 0px
      - --paper-card-background-color: rgba(0, 0, 0, 0)
      icon:
      - width: 50px
      name:
      - justify-self: middle
      - align-self: end
      - font-size: 14px
      - padding: 0px 0px
      - color: var(--secondary-text-color)
    tap_action:
      action: call-service
  menu_button:
    aspect_ratio: 4/3
    color_type: icon
    hold_action:
      action: none
    layout: vertical
    show_label: false
    show_name: false
    show_state: false
    styles:
      card:
      - border-radius: 10px
      - border: solid 1px var(--primary-color)
      - box-shadow: none
      - padding: 6px 6px
      - margin: 0px 0px
      - --paper-card-background-color: rgba(0, 0, 0, 0)
      icon:
      - width: 28px
      name:
      - justify-self: middle
      - align-self: end
      - font-size: 14px
      - padding: 0px 0px
      - color: var(--secondary-text-color)
    tap_action:
      action: call-service
kiosk_mode:
  admin_settings:
    ignore_entity_settings: true
  entity_settings:
  - entity:
      input_boolean.kiosk_mode: 'on'
    kiosk: true
views:
- cards: []
  icon: mdi:home
  max_columns: 3
  path: '0'
  sections:
  - cards:
    - cards:
      - aspect_ratio: 1/1
        entity: person.murthy
        image: /local/images/murthy.jpg
        name: Murthy
        show_name: false
        show_state: false
        state_filter:
          not_home: brightness(60%) grayscale(90%) blur(2px)
        type: picture-entity
      - aspect_ratio: 1/1
        entity: person.kameswari
        image: /local/images/kameswari.jpg
        show_name: false
        show_state: false
        state_filter:
          not_home: brightness(60%) grayscale(90%) blur(2px)
        type: picture-entity
      type: horizontal-stack
    - cards:
      - aspect_ratio: 1/1
        icon: mdi:cctv
        size: 70%
        styles:
          card:
          - border-radius: 25px
        tap_action:
          action: navigate
          navigation_path: /lovelace-wallmount/cameras
        tooltip: Tap to open Cameras
        type: custom:button-card
      - aspect_ratio: 1/1
        color_type: icon
        entity: sensor.motor_state
        entity_picture: true
        extra_styles: "@keyframes wave {\n  0%   { background-position-x: 0; }\n \
          \ 100% { background-position-x: -100%; }\n}\n"
        hold_action:
          action: navigate
          navigation_path: /lovelace-wallmount/motors
        icon: mdi:water-pump
        show_label: false
        show_name: true
        size: 70%
        state:
        - color: dodgerblue
          name: Upstairs
          value: Upstairs
        - color: dodgerblue
          name: Downstairs
          value: Downstairs
        - color: lightgrey
          icon: mdi:water-pump-off
          name: ' '
          value: MotorsOff
        - color: black
          icon: mdi:water-pump
          name: ' '
          value: TankFull
        styles:
          card:
          - background-size: cover
          - border-radius: 25px
          - background-image: '[[[ if (entity.state == "TankFull") return ''url("/local/icons/wave.png")'';
              else return '' '' ]]] '
          - animation: wave 1s linear infinite
          - background-size: 80% 100%;
          - border-radius: 25px
        tap_action:
          action: navigate
          navigation_path: /lovelace-wallmount/motors
        type: custom:button-card
      - aspect_ratio: 1/1
        color: auto
        entity: switch.downstairs_geyser
        entity_picture: /local/icons/geyser.png
        hold_action:
          action: more-info
        show_entity_picture: true
        show_name: false
        size: 70%
        state:
        - styles:
            icon:
            - filter: grayscale(50%) opacity(40%)
          value: 'off'
        - styles:
            icon:
            - filter: grayscale(100%) opacity(10%)
          value: unavailable
        styles:
          card:
          - border-radius: 25px
        type: custom:button-card
      type: horizontal-stack
    - cards:
      - entity: sensor.moon_phase
        show_entity_picture: true
        show_name: false
        size: 100%
        styles:
          card:
          - height: 100px
          - width: 100px
          - margin: 0px 150px
          - padding: 0px 0px
          - color: ivory
          - border-radius: 100px
        type: custom:button-card
      - card:
          entity: device_tracker.phone_prasad_redmi9i
          entity_picture: /local/images/prasad.jpg
          show_entity_picture: true
          show_name: false
          size: 200%
          styles:
            card:
            - position: absolute
            - left: -150px
            - height: 100px
            - width: 100px
            - color: ivory
          type: custom:button-card
        conditions:
        - entity: device_tracker.phone_prasad_redmi9i
          state: home
        type: conditional
      type: horizontal-stack
    - cards:
      - cards:
        - camera_view: live
          entity: image.front_yard_camera_person
          show_state: false
          type: picture-entity
        - camera_view: live
          entity: image.second_floor_camera_person
          show_name: true
          show_state: false
          type: picture-entity
        type: horizontal-stack
      mode: vertical
      type: custom:stack-in-card
    - badge_color: '{{ ''deep-orange'' if ''AM'' in states(''sensor.ireland_time'')
        else ''grey'' }}'
      badge_icon: '{{ ''mdi:weather-sunny'' if ''AM'' in states(''sensor.ireland_time'')
        else ''mdi:weather-night'' }}'
      card_mod:
        style:
          .: "ha-card {\n  --card-primary-font-size: 30px;\n  margin-right: -10px\
            \ !important;\n  background: transparent !important;\n}\nmushroom-badge-icon\
            \ {\n  --badge-icon-size: 15px;\n  --badge-size: 20px;\n}\n"
          mushroom-shape-avatar$: ".container {\n  --icon-size: 50px;\n  margin: -5px\
            \ !important;\n  margin-right: 5px !important;\n  \n}\n"
      double_tap_action:
        action: none
      fill_container: true
      grid_options:
        columns: 6
        rows: 3
      hold_action:
        action: none
      icon: ''
      layout: vertical
      multiline_secondary: false
      picture: /local/icons/ire.png
      primary: '{{states.sensor.ireland_time.state}}'
      tap_action:
        action: none
      type: custom:mushroom-template-card
    - badge_color: '{{ ''deep-orange'' if ''AM'' in states(''sensor.canada_time'')
        else ''grey'' }}'
      badge_icon: '{{ ''mdi:weather-sunny'' if ''AM'' in states(''sensor.canada_time'')
        else ''mdi:weather-night'' }}'
      card_mod:
        style:
          .: "ha-card {\n  --card-primary-font-size: 30px;\n  margin-right: -10px\
            \ !important;\n  background: transparent !important;\n}\nmushroom-badge-icon\
            \ {\n  --badge-icon-size: 15px;\n  --badge-size: 20px;\n}\n"
          mushroom-shape-avatar$: ".container {\n  --icon-size: 50px;\n  margin: -5px\
            \ !important;\n  margin-right: 5px !important;\n  \n}\n"
      double_tap_action:
        action: none
      fill_container: true
      grid_options:
        columns: 6
        rows: 3
      hold_action:
        action: none
      icon: ''
      layout: vertical
