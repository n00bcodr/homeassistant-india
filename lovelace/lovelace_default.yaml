---
button_card_templates:
  app_launcher:
    aspect_ratio: 21/9
    entity_picture: "[[[ \n  const icon = variables.app_icon || variables.app_name.toLowerCase().replace(/\
      \ /g, '');\n  return `/local/icons/${icon}.png`;\n]]]\n"
    hold_action:
      action: none
    layout: vertical
    show_entity_picture: true
    show_label: false
    show_name: false
    show_state: false
    styles:
      card:
      - border-radius: 10px
      - border: solid 0.5px var(--primary-color)
      - box-shadow: none
      - padding: 0px 0px
      - margin: 0px
      - background-color: '[[[ return variables.card_color || ''rgba(0, 0, 0, 0)'';
          ]]]'
      entity_picture:
      - width: '[[[ return variables.icon_width || ''55%''; ]]]'
    tap_action:
      action: call-service
      service: media_player.play_media
      service_data:
        media_content_id: '[[[ return variables.media_id || variables.app_name; ]]]'
        media_content_type: app
      target:
        entity_id: '[[[ return variables.target_player || ''media_player.sony_bravia_tv'';
          ]]]'
  blank_button:
    aspect_ratio: 4/3
    color_type: icon
    hold_action:
      action: none
    layout: vertical
    show_label: false
    show_name: false
    show_state: false
    styles:
      card:
      - border-radius: 0px
      - border: solid 0px var(--primary-color)
      - box-shadow: none
      - padding: 6px 6px
      - margin: 0px 0px
      - --paper-card-background-color: rgba(0, 0, 0, 0)
    tap_action:
      action: none
  icon_button:
    aspect_ratio: 4/3
    color_type: card
    hold_action:
      action: none
    layout: vertical
    show_label: false
    show_name: false
    show_state: false
    styles:
      card:
      - border-radius: 10px
      - border: solid 1px var(--primary-color)
      - box-shadow: none
      - padding: 6px 6px
      - margin: 0px 0px
      - --paper-card-background-color: rgba(0, 0, 0, 0)
      icon:
      - width: 28px
    tap_action:
      action: call-service
  logo_button:
    aspect_ratio: 21/9
    color: rgb(255,255,255)
    color_type: card
    hold_action:
      action: none
    layout: vertical
    show_label: false
    show_name: false
    show_state: false
    styles:
      card:
      - border-radius: 5px
      - border: solid 0.5px var(--primary-color)
      - box-shadow: none
      - padding: 0px 0px
      - margin: 0px 0px
      - --paper-card-background-color: rgba(0, 0, 0, 0)
      entity_picture:
      - width: 55%
      icon:
      - width: 50px
    tap_action:
      action: call-service
  menu_button:
    aspect_ratio: 4/3
    color_type: icon
    hold_action:
      action: none
    layout: vertical
    show_label: false
    show_name: false
    show_state: false
    styles:
      card:
      - border-radius: 10px
      - border: solid 1px var(--primary-color)
      - box-shadow: none
      - padding: 6px 6px
      - margin: 0px 0px
      - --paper-card-background-color: rgba(0, 0, 0, 0)
      icon:
      - width: 28px
    tap_action:
      action: call-service
title: ''
views:
- badges:
  - color: "{{ 'yellow' if (\n    states.light | selectattr('state', '==', 'on')\n\
      \    | rejectattr('entity_id', 'in', ['light.pooja_light', 'light.living_room_light',\
      \ 'light.front_yard_lights_group', 'light.living_room_fan'])\n    | list | count)\
      \ > 0 else 'grey' }}"
    content: "{{ states.light\n      | selectattr('state', '==', 'on')\n      | rejectattr('entity_id',\
      \ 'in', ['light.pooja_light', 'light.living_room_light', 'light.front_yard_lights_group',\
      \ 'light.living_room_fan'])\n      | list\n      | count }}"
    icon: "{{ 'mdi:lightbulb-on' if (\n    states.light | selectattr('state', '==',\
      \ 'on')\n    | rejectattr('entity_id', 'in', ['light.pooja_light', 'light.living_room_light',\
      \ 'light.front_yard_lights_group', 'light.living_room_fan'])\n    | list | count)\
      \ > 0 else 'mdi:lightbulb' }}"
    type: custom:mushroom-template-badge
  - entity: binary_sensor.upstairs_hall_camera_cell_motion_detection
    show_entity_picture: false
    show_icon: true
    show_name: false
    show_state: true
    state_content: last_changed
    type: entity
  - entity: device_tracker.padmavathi_phone
    show_icon: true
    show_name: true
    show_state: false
    type: entity
    visibility:
    - condition: or
      conditions:
      - condition: state
        entity: device_tracker.padmavathi_phone
        state: home
      - condition: screen
        media_query: '(min-width: 768px)'
  - entity: device_tracker.raja_ganesh_phone
    show_icon: true
    show_name: true
    show_state: false
    type: entity
    visibility:
    - condition: or
      conditions:
      - condition: state
        entity: device_tracker.raja_ganesh_phone
        state: home
      - condition: screen
        media_query: '(min-width: 768px)'
  - color: "{% if is_state(config.entity, 'on') %}\n  red\n{% elif is_state(config.entity,\
      \ 'off') %}\n  grey\n{% endif %}"
    content: "{% if is_state(config.entity, 'on') %}\n  Disabled\n{% elif is_state(config.entity,\
      \ 'off') %}\n  Visible\n{% endif %}"
    entity: switch.downstairs_camera_privacy
    hold_action:
      action: more-info
    icon: "{% if is_state(config.entity, 'on') %}\n  mdi:eye-off-outline\n{% elif\
      \ is_state(config.entity, 'off') %}\n  mdi:cctv\n{% endif %}"
    label: Downstairs Cam
    tap_action:
      action: toggle
    type: custom:mushroom-template-badge
    visibility:
    - condition: user
      users:
      - 74f7e2ffd3594037b1a2fc4de82d9fea
  - color: "{% if is_state(config.entity, 'on') %}\n  red\n{% elif is_state(config.entity,\
      \ 'off') %}\n  grey\n{% endif %}"
    content: "{% if is_state(config.entity, 'on') %}\n  Disabled\n{% elif is_state(config.entity,\
      \ 'off') %}\n  Visible\n{% endif %}"
    entity: switch.upstairs_camera_privacy
    hold_action:
      action: more-info
    icon: "{% if is_state(config.entity, 'on') %}\n  mdi:eye-off-outline\n{% elif\
      \ is_state(config.entity, 'off') %}\n  mdi:cctv\n{% endif %}"
    label: Upstairs Cam
    tap_action:
      action: toggle
    type: custom:mushroom-template-badge
    visibility:
    - condition: user
      users:
      - 74f7e2ffd3594037b1a2fc4de82d9fea
  cards: []
  icon: mdi:ninja
  max_columns: 4
  path: master
  sections:
  - cards:
    - card_mod:
        style: "ha-card {\n  {% if is_state(config.entity, 'on') %}\n     background:\
          \ rgba(var(--rgb-blue), 0.2);\n  {%- else -%}\n  {%- endif %}\n}\n"
      entity: switch.den_fan
      fill_container: false
      grid_options:
        columns: full
        rows: 1
      icon: mdi:ceiling-fan
      icon_color: blue
      tap_action:
        action: toggle
      type: custom:mushroom-entity-card
    - card_mod:
        style: "ha-card {\n  {% set r = state_attr(config.entity, 'rgb_color')[0]\
          \ %}\n  {% set g = state_attr(config.entity, 'rgb_color')[1] %}\n  {% set\
          \ b = state_attr(config.entity, 'rgb_color')[2] %}\n  background: rgba(\
          \ {{r}}, {{g}}, {{b}}, 0.2 );\n}\n"
      collapsible_controls: true
      entity: light.night_light
      fill_container: true
      layout: horizontal
      name: Night Light
      show_brightness_control: true
      show_color_temp_control: true
      tap_action:
        action: toggle
      type: custom:mushroom-light-card
      use_light_color: true
    - card_mod:
        style: "ha-card {\n  {% if is_state(config.entity, 'on') %}\n     background:\
          \ rgba(var(--rgb-pink), 0.2);\n  {%- else -%}\n  {%- endif %}\n}\n"
      entity: switch.workstation
      fill_container: false
      grid_options:
        columns: full
        rows: 1
      icon: mdi:desk
      icon_color: pink
      name: Workstation
      tap_action:
        action: toggle
      type: custom:mushroom-entity-card
    - collapsible_controls: true
      entity: media_player.akashavani
      grid_options:
        columns: full
      media_controls:
      - play_pause_stop
      - on_off
      show_volume_level: false
      type: custom:mushroom-media-player-card
      use_media_info: true
      volume_controls:
      - volume_set
    - badge_color: none
      badge_icon: "{% if is_state(config.entity, 'Locked') %}\n  mdi:monitor-off\n\
        {% elif is_state(config.entity, 'Unlocked') %}\n  mdi:monitor\n{% elif is_state(config.entity,\
        \ 'unavailable') %}\n  mdi:exclamation-thick\n{% endif %}"
      card_mod:
        style: "ha-card {\n  {% if is_state(config.entity, 'Locked') %}\n    background:\
          \ rgba(255, 255, 0, 0.2);\n  {% elif is_state(config.entity, 'Unlocked')\
          \ %}\n    background: rgba(0, 255, 0, 0.2);\n  {% elif is_state(config.entity,\
          \ 'unavailable') %}\n    background: rgba(255, 0, 0, 0.2);\n  {% endif %}\n\
          }\n"
      color: "{% if is_state(config.entity, 'Locked') %}\n  yellow\n{% elif is_state(config.entity,\
        \ 'Unlocked') %}\n  green\n{% elif is_state(config.entity, 'unavailable')\
        \ %}\n  red\n{% endif %}"
      entity: sensor.desktop_sessionstate
      features_position: bottom
      grid_options:
        columns: full
      icon: "{% if is_state(config.entity, 'Locked') %}\n  mdi:lock\n{% elif is_state(config.entity,\
        \ 'Unlocked') %}\n  mdi:lock-open\n{% elif is_state(config.entity, 'unavailable')\
        \ %}\n  mdi:power-plug-off-outline\n{% endif %}"
      primary: "{% if is_state(config.entity, 'Locked') %}\n  Away\n{% elif is_state(config.entity,\
        \ 'Unlocked') %}\n  At Desk\n{% elif is_state(config.entity, 'unavailable')\
        \ %}\n  Turned off\n{% endif %} - at {{(as_timestamp(states.sensor.desktop_sessionstate.last_changed)\
        \ |\n            timestamp_custom('%-I:%M %p'))}}"
      secondary: Desktop
      tap_action:
        action: more-info
      type: custom:mushroom-template-card
    - collapsible_controls: false
      entity: climate.den_ac
      grid_options:
        columns: full
      hvac_modes:
      - auto
      - cool
      show_temperature_control: true
      type: custom:mushroom-climate-card
    - card_mod:
        style: ":host {\n  height: 200px !important;\n}\n"
      cards:
      - badge_color: ''
        badge_icon: ''
        card_mod:
          style:
            .: "ha-card {\n  border: 0px !important;\n  box-shadow: none !important;\n\
              \  background: none;\n}\n"
            mushroom-shape-icon$: ".shape {\n  position: relative;\n  left: -40px;\n\
              \  top: 60px;\n  --icon-size: 160px !important;\n}\n"
            mushroom-state-info$: ".primary {\n  font-size: 22px !important;\n  position:\
              \ relative !important;\n  top: -60px !important;\n  left: -160px !important;\n\
              \  overflow: visible !important;\n}\n.secondary {\n  font-size: 15px\
              \ !important;\n  position: relative !important;\n  overflow: visible\
              \ !important;\n  top: -50px !important;\n  left: -160px;\n}\n"
        icon: mdi:package-up
        icon_color: "{% if is_state('binary_sensor.hacs_updates', 'on') or is_state('binary_sensor.other_updates',\
          \ 'on') or is_state('binary_sensor.addon_updates', 'on') %}\n  red\n{%elif\
          \ is_state('update.home_assistant_supervisor_update', 'on') or is_state('update.home_assistant_core_update',\
          \ 'on') %}\n  blue\n{%else%} disabled {% endif %}"
        layout: horizontal
        primary: Updates
        secondary: "{% set hacs_updates = states.update | selectattr('state', 'eq',\
          \ 'on') | selectattr('entity_id', 'in', integration_entities('hacs')) |\
          \ map(attribute='name') | list | count %}\n{% set addon_updates = states.update\
          \ | selectattr('state', 'eq', 'on') | selectattr('entity_id', 'in', integration_entities('hassio'))\
          \ |  rejectattr('entity_id', 'eq', 'update.home_assistant_core_update')\
          \ |  rejectattr('entity_id', 'eq', 'update.home_assistant_supervisor_update')\
          \ |  map(attribute='name') | list | count %}\n{% set other_updates = states.update\
          \ | selectattr('state', 'eq', 'on') | rejectattr('entity_id', 'in', integration_entities('hassio'))\
          \ | rejectattr('entity_id', 'in', integration_entities('hacs')) | map(attribute='name')\
          \ | list | count %}\n{% set supervisor_update = is_state('update.home_assistant_supervisor_update',\
          \ 'on') %} {% set core_update = is_state('update.home_assistant_core_update',\
          \ 'on') %}\n{% if hacs_updates == 0 and addon_updates == 0 and other_updates\
          \ == 0 and not supervisor_update and not core_update %}\n  No updates\n\
          {% else %}\n  {% if hacs_updates != 0 %}\n    HACS Updates: {{ hacs_updates\
          \ }}\n  {% endif %}\n  {% if addon_updates != 0 %}\n    Addon Updates: {{\
          \ addon_updates }}\n  {% endif %}\n  {% if other_updates != 0 %}\n    Other\
          \ Updates: {{ other_updates }}\n  {% endif %}\n  {% if supervisor_update\
          \ %}\n    Supervisor Update Available!\n  {% endif %}\n  {% if core_update\
          \ %}\n    Core Update Available!\n  {% endif %}\n{% endif %}\n"
        tap_action:
          action: navigate
          navigation_path: /lovelace/updates
        type: custom:mushroom-legacy-template-card
      - card_mod:
          style:
            .: "ha-card {\n  height: 0px !important;\n  margin-left: 75%;\n  top:\
              \ -150px;\n  background: none;\n}\n:host {\n  --mush-icon-size: 45px;\n\
              }\nha-card:active {\n  transform: rotateX(25deg);\n  transform-origin:\
              \ center bottom;\n  transition: 0s;\n}\n"
        entity: binary_sensor.hacs_updates
        hold_action:
          action: more-info
        icon: hacs:hacs
        icon_color: "{% if is_state(config.entity, 'on') %}\n  blue\n{% else %}\n\
          \  disabled\n{% endif %}"
        primary: null
        secondary: null
        tap_action:
          action: more-info
        type: custom:mushroom-legacy-template-card
      - card_mod:
          style:
            .: "ha-card {\n  height: 0px !important;\n  margin-left: 75%;\n  top:\
              \ -90px;\n  background: none;\n}\n:host {\n  --mush-icon-size: 45px;\n\
              }\nha-card:active {\n  transform: rotateX(25deg);\n  transform-origin:\
              \ center bottom;\n  transition: 0s;\n}\n"
        entity: binary_sensor.addon_updates
        hold_action:
          action: more-info
        icon: mdi:home-assistant
        icon_color: "{% if is_state(config.entity, 'on') %}\n  blue\n{% else %}\n\
          \  disabled\n{% endif %}"
        primary: null
        secondary: null
        tap_action:
          action: more-info
        type: custom:mushroom-legacy-template-card
      - card_mod:
          style:
            .: "ha-card {\n  height: 0px !important;\n  margin-left: 75%;\n  top:\
              \ -30px;\n  background: none;\n}\n:host {\n  --mush-icon-size: 45px;\n\
              }\nha-card:active {\n  transform: rotateX(25deg);\n  transform-origin:\
              \ center bottom;\n  transition: 0s;\n}\n"
        entity: binary_sensor.other_updates
        hold_action:
          action: more-info
        icon: mdi:arrow-up-bold-hexagon-outline
        icon_color: "{% if is_state(config.entity, 'on') %}\n  green\n{% else %}\n\
          \  disabled\n{% endif %}"
        primary: null
        secondary: null
        tap_action:
          action: more-info
        type: custom:mushroom-legacy-template-card
      type: custom:vertical-stack-in-card
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: binary_sensor.addon_updates
          state: 'on'
        - condition: state
          entity: binary_sensor.updater_supervisor
          state: 'on'
        - condition: state
          entity: binary_sensor.hacs_updates
          state: 'on'
    type: grid
  - cards:
    - cameras:
      - camera_entity: camera.front_yard_camera
        live_provider: auto
        title: First Floor
      - camera_entity: camera.entrance_camera
        live_provider: auto
        title: Entrance
      - camera_entity: camera.driveway_camera
        live_provider: auto
        title: Driveway
      - camera_entity: camera.second_floor_camera
        live_provider: auto
        title: Second Floor
      - camera_entity: camera.hall_camera
        live_provider: auto
        title: Hall
      live:
        auto_play:
        - visible
        preload: true
        transition_effect: slide
      performance:
        style:
          border_radius: true
          box_shadow: true
      type: custom:advanced-camera-card
      view:
        default: live
        dim: false
    - cards:
      - camera_view: live
        entity: image.front_yard_camera_person
        fit_mode: cover
        show_name: true
        show_state: false
        type: picture-entity
      - camera_view: live
        entity: image.hall_camera_person
        show_name: true
        show_state: false
        type: picture-entity
      mode: horizontal
      type: custom:stack-in-card
    - card:
        show_header_toggle: false
        state_color: false
        title: 💡
        type: entities
      filter:
        exclude:
        - entity_id: light.living_room_fan
        - entity_id: light.pooja_light
        - entity_id: light.front_yard_lights_group
        - entity_id: light.living_room_light
        include: []
      show_empty: false
      type: custom:auto-entities
    type: grid
  title: Master
  type: sections
  visible:
  - user: 74f7e2ffd3594037b1a2fc4de82d9fea
- badges:
  - alignment: center
    chips:
    - content_info: none
      entity: sun.sun
      hold_action:
        action: more-info
      icon_color: orange
      tap_action:
        action: navigate
        navigation_path: '#sun'
      type: entity
      use_entity_picture: false
    - content_info: none
      entity: sensor.moon
      tap_action:
        action: navigate
        navigation_path: '#moon'
      type: entity
      use_entity_picture: true
    - entity: weather.home
      show_conditions: true
      show_temperature: true
      type: weather
    type: custom:mushroom-chips-card
  - entity: person.murthy
    show_entity_picture: true
    type: entity
  - entity: person.kameswari
    show_entity_picture: true
    type: entity
  - color: red
    entity: script.cctv
    icon: mdi:cctv
    name: CCTV
    state_content: name
    tap_action:
      action: perform-action
      perform_action: script.cctv
    type: entity
  - color: '{%if is_state(config.entity, ''off'') %}

      red

      {% else %}

      green

      {% endif %}'
    content: "{%if is_state(config.entity, 'off') %}\n Off since {{ states[config.entity].last_changed\
      \ | relative_time }}\n\n{% else %}\n On\n{% endif %}"
    entity: binary_sensor.downstairs_power
    icon: '{%if is_state(config.entity, ''off'') %}

      mdi:power-plug-off

      {% else %}

      mdi:power-plug

      {% endif %}'
    label: '{{ states[config.entity].attributes.friendly_name }}'
    type: custom:mushroom-template-badge
    visibility:
    - condition: state
      entity: binary_sensor.downstairs_power
      state: 'off'
  - color: '{%if is_state(config.entity, ''off'') %}

      red

      {% else %}

      green

      {% endif %}'
    content: "{%if is_state(config.entity, 'off') %}\n Off since {{ states[config.entity].last_changed\
      \ | relative_time }}\n{% else %}\n On\n{% endif %}"
    entity: binary_sensor.upstairs_power
    icon: '{%if is_state(config.entity, ''off'') %}

      mdi:power-plug-off

      {% else %}

      mdi:power-plug

      {% endif %}'
    label: '{{ states[config.entity].attributes.friendly_name }}'
    type: custom:mushroom-template-badge
    visibility:
    - condition: state
      entity: binary_sensor.upstairs_power
      state: 'off'
  cards: []
  dense_section_placement: false
  header:
    badges_position: bottom
    badges_wrap: wrap
    layout: center
  icon: mdi:sofa
  max_columns: 3
  path: living-room
  sections:
  - cards:
    - card:
        card_mod:
          style:
            mushroom-shape-icon$: ".shape {\n  --icon-symbol-size: 100px;\n  --icon-size:\
              \ 150px;        \n  border: 2px solid dodgerblue;\n}\n"
            mushroom-state-info$: ".container {\n --card-primary-font-size: 20px;\n\
              }\n"
        entity: switch.downstairs_motor_switch_1
        fill_container: true
        icon: '{% if is_state(config.entity, ''on'') %}

          mdi:water-pump

          {% else %}

          mdi:water-pump-off

          {% endif %}'
        icon_color: '{% if is_state(config.entity, ''on'') %}

          blue

          {% else %}

          grey

          {% endif %}'
        layout: vertical
        primary: Downstairs Motor
        secondary: ''
        type: custom:mushroom-legacy-template-card
      conditions:
      - entity: switch.downstairs_motor_switch_1
        state: 'on'
      grid_options:
        columns: 6
        rows: 4
      type: conditional
    - card:
        card_mod:
          style:
            mushroom-shape-icon$: ".shape {\n  --icon-symbol-size: 100px;\n  --icon-size:\
              \ 150px;        \n  border: 2px solid dodgerblue;\n}\n"
            mushroom-state-info$: ".container {\n --card-primary-font-size: 20px;\n\
              }\n"
        entity: switch.upstairs_motor
        fill_container: true
        icon: '{% if is_state(config.entity, ''on'') %}

          mdi:water-pump

          {% else %}

          mdi:water-pump-off

          {% endif %}'
        icon_color: '{% if is_state(config.entity, ''on'') %}

          blue

          {% else %}

          grey

          {% endif %}'
        layout: vertical
        primary: Upstairs Motor
        secondary: ''
        type: custom:mushroom-legacy-template-card
      conditions:
      - entity: switch.upstairs_motor
        state: 'on'
      grid_options:
        columns: 6
        rows: 4
      type: conditional
    - cards:
      - card_mod:
          style: "ha-card {\n  {% if is_state(config.entity, 'on') %}\n     background:\
            \ rgba(var(--rgb-green), 0.2);\n  {%- else -%}\n  {%- endif %}\n}\n"
        collapsible_controls: true
        entity: fan.living_room_fan
        icon_animation: true
        layout: horizontal
        name: Fan
        show_percentage_control: true
        type: custom:mushroom-fan-card
      - card_mod:
          style: "ha-card {\n  {% set r = state_attr(config.entity, 'rgb_color')[0]\
            \ %}\n  {% set g = state_attr(config.entity, 'rgb_color')[1] %}\n  {%\
            \ set b = state_attr(config.entity, 'rgb_color')[2] %}\n  background:\
            \ rgba( {{r}}, {{g}}, {{b}}, 0.2 );\n}\n"
        collapsible_controls: true
        entity: light.living_room_light
        fill_container: true
        icon: mdi:lightbulb-fluorescent-tube-outline
        layout: horizontal
