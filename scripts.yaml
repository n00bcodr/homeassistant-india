cctv:
  alias: Switch to CCTV
  sequence:
  - action: media_player.select_source
    metadata: {}
    data:
      source: HDMI 4
    target:
      entity_id:
      - media_player.sony_bravia_tv
  mode: single
  icon: mdi:cctv
hdmi_one:
  alias: HDMI 1
  sequence:
  - action: media_player.select_source
    metadata: {}
    data:
      source: HDMI 1
    target:
      entity_id:
      - media_player.sony_bravia_tv
  mode: queued
  max: 3
hdmi_two:
  alias: HDMI 2
  sequence:
  - action: media_player.select_source
    metadata: {}
    data:
      source: HDMI 2
    target:
      entity_id:
      - media_player.sony_bravia_tv
  mode: queued
  max: 3
hdmi_three:
  alias: HDMI 3
  sequence:
  - action: media_player.select_source
    metadata: {}
    data:
      source: HDMI 3
    target:
      entity_id:
      - media_player.sony_bravia_tv
  mode: queued
  max: 3
chromecast:
  alias: Chromecast
  sequence:
  - service: media_player.select_source
    data:
      source: Chromecast
    target:
      entity_id: media_player.lg_tv
  mode: single
update_all_phone_sensors:
  alias: Update all phone sensors
  sequence:
  - service: notify.all_phones
    data:
      message: command_update_sensors
  mode: single
  icon: mdi:cellphone-arrow-down
git_push:
  alias: Git Push
  sequence:
  - service: shell_command.git_commit_push
    data: {}
  mode: single
  icon: mdi:git
git_push_ha_version:
  alias: Git Push - Core Update
  sequence:
  - service: shell_command.git_core_update_push
    data: {}
  mode: single
  icon: mdi:git
git_commit_copy:
  alias: Git Commit Message Copy
  sequence:
  - service: input_text.set_value
    data:
      value: "\U0001F4C1 files on {{ now().timestamp() | timestamp_custom('%b %d,
        %Y - %-I:%M %p') }}"
    target:
      entity_id: input_text.git_commit_message
  mode: single
  icon: fas:paste
install_hacs_updates:
  sequence:
  - target:
      entity_id: '{{ states.update | selectattr(''state'', ''eq'', ''on'') |  selectattr(''entity_id'',
        ''in'', integration_entities(''hacs'')) |  map(attribute=''entity_id'') |
        list }}'
    action: update.install
  alias: Install HACS Updates
  description: ''
install_add_on_updates:
  sequence:
  - target:
      entity_id: '{{ states.update | selectattr(''state'', ''eq'', ''on'') |  selectattr(''entity_id'',
        ''in'', integration_entities(''hassio'')) | rejectattr(''entity_id'', ''eq'',
        ''update.home_assistant_core_update'') | map(attribute=''entity_id'') | list
        }}'
    action: update.install
  alias: Install Add-on Updates
  description: ''
install_other_updates:
  sequence:
  - target:
      entity_id: '{{ states.update | selectattr(''state'', ''eq'', ''on'') |  rejectattr(''entity_id'',
        ''in'', integration_entities(''hassio'')) |  rejectattr(''entity_id'', ''in'',
        integration_entities(''hacs'')) | map(attribute=''entity_id'') | list }}'
    action: update.install
  alias: Install Other Updates
  description: ''
