mqtt:
  host: 192.168.68.168
  port: 1883
  user: mqtt-user
  password: homeassistant
  topic_prefix: frigate

birdseye:
  enabled: true

timestamp_style:
  position: tr
  format: '%d-%b-%Y %I:%M:%S %p'
  thickness: 2

record:
  enabled: false
  retain:
    days: 2
    mode: motion
  alerts:
    retain:
      days: 2
  detections:
    retain:
      days: 2
snapshots:
  enabled: true
  retain:
    default: 2

cameras:
  livingroom_camera:
    snapshots:
      enabled: true
      retain:
        default: 1
    mqtt:
      quality: 75
    ffmpeg:
      inputs:
        - path: rtsp://homeassistant:homeassistant123@192.168.68.171/stream1
          roles:
            - detect
    detect:
      width: 1920
      height: 1080
      fps: 25
    motion:
      contour_area: 50
      mask:
        - 0,0,0,73,642,63,642,0
  hall_camera:
    snapshots:
      enabled: true
      retain:
        default: 1
    mqtt:
      quality: 75
    ffmpeg:
      inputs:
        - path: rtsp://homeassistant:homeassistant123@192.168.68.172/stream1
          roles:
            - detect
    detect:
      width: 1920
      height: 1080
      fps: 25
    motion:
      contour_area: 50
      mask:
        - 0,0,0,73,642,63,642,0
  front_yard_camera:
    snapshots:
      enabled: true
      quality: 90
    mqtt:
      quality: 80
    ffmpeg:
      inputs:
        - path: rtsp://homeassistant:homeassistant123@192.168.68.33:554/Streaming/Channels/101
          roles:
            - detect
    detect:
      width: 1920
      height: 1080
      fps: 30
    zones:
      steps:
        coordinates: 
          0.019,0.09,0.11,0.091,0.26,0.558,0.269,0.493,0.276,0.437,0.283,0.369,0.299,0.324,0.291,0.278,0.307,0.211,0.342,0.162,0.34,0.119,0.362,0.076,0.358,0.031,0.37,0,0.503,0,0.557,0,0.549,0.099,0.744,0.117,0.745,0,0.787,0,1,0,0.896,0.572,0.904,1,1,1,0.177,1
        inertia: 2
        loitering_time: 0
    motion:
      contour_area: 30
      improve_contrast: true
      mask: 0.144,0.059,0.278,0.053,0.278,0.076,0.146,0.074
      threshold: 20
    review:
      alerts:
        required_zones: steps
      detections:
        required_zones: steps
  second_floor_camera:
    mqtt:
      quality: 1
    ffmpeg:
      inputs:
        - path: rtsp://homeassistant:homeassistant123@192.168.68.33:554/Streaming/Channels/201
          roles:
            - detect
    detect:
      width: 1920
      height: 1080
      fps: 1
    motion:
      # threshold: 30
      contour_area: 50
  entrance_camera:
    snapshots:
      enabled: false  
    mqtt:
      quality: 70
    ffmpeg:
      inputs:
        - path: rtsp://homeassistant:homeassistant123@192.168.68.33:554/Streaming/Channels/301
          roles:
            - detect
    detect:
      width: 1920
      height: 1080
      fps: 25
    motion:
      threshold: 30
      contour_area: 60
  driveway_camera:
    snapshots:
      enabled: false      
    mqtt:
      quality: 70
    ffmpeg:
      inputs:
        - path: rtsp://homeassistant:homeassistant123@192.168.68.33:554/Streaming/Channels/401
          roles:
            - detect
    detect:
      width: 1920
      height: 1080
      fps: 5
    motion:
      threshold: 30
      contour_area: 60
      mask: 0.277,0.079,0.02,0.077,0.019,0.055,0.28,0.052
detectors:
  coral:
    type: edgetpu
    device: usb
version: 0.15-1
semantic_search:
  enabled: true
  reindex: false
  model_size: small
