mqtt:
  host: 192.168.68.168
  port: 1883
  user: mqtt-user
  password: homeassistant
  topic_prefix: frigate

birdseye:
  enabled: false

ffmpeg:
  hwaccel_args: auto

timestamp_style:
  position: tr
  format: '%d-%b-%Y %I:%M:%S %p'
  thickness: 2

record:
  enabled: false
  retain:
    days: 1
    mode: motion
  alerts:
    retain:
      days: 1
  detections:
    retain:
      days: 1
snapshots:
  enabled: true
  retain:
    default: 1

cameras:
  # livingroom_camera:
  #   snapshots:
  #     enabled: true
  #     retain:
  #       default: 1
  #   mqtt:
  #     quality: 75
  #   ffmpeg:
  #     inputs:
  #       - path: rtsp://homeassistant:homeassistant123@192.168.68.171/stream1
  #         roles:
  #           - detect
  #   detect:
  #     width: 1920
  #     height: 1080
  #     fps: 25
  #   motion:
  #     contour_area: 50
  #     mask:
  #       - 0,0,0,73,642,63,642,0
  hall_camera:
    snapshots:
      enabled: true
      retain:
        default: 1
    mqtt:
      quality: 75
    ffmpeg:
      inputs:
        - path: rtsp://homeassistant:homeassistant123@192.168.68.172/stream2
          roles:
            - detect
    detect:
      width: 1920
      height: 1080
      fps: 25
    motion:
      contour_area: 50
      mask: 0,0,0,0.068,0.359,0.06,0.358,0
  front_yard_camera:
    snapshots:
      enabled: true
      quality: 90
    mqtt:
      quality: 80
    ffmpeg:
      inputs:
        - path: 
            rtsp://homeassistant:homeassistant123@192.168.68.33:554/Streaming/Channels/101
          roles:
            - detect
    detect:
      width: 1920
      height: 1080
      fps: 30
    zones:
      steps:
        coordinates: 
          0,0,0.048,0,0.175,0.571,0.276,0,0.473,0,0.463,0.126,0.657,0.147,0.668,0,1,0,0.887,0.133,0.809,0.604,0.827,1,1,1,0.177,1,0.114,0.667,0,0.256
        inertia: 2
        loitering_time: 0
        objects: person
    motion:
      contour_area: 40
      improve_contrast: true
      mask:
        - 0.144,0.059,0.278,0.053,0.278,0.076,0.146,0.074 #time
        - 0,0,0.052,0.4,0.123,0.665,0.176,1,0,1 #plant
        - 0.048,0,0.273,0,0.231,0.236,0.175,0.577,0.085,0.178 #steps outside
        - 0.481,0,0.465,0.123,0.656,0.144,0.668,0 # other house
      threshold: 30
    review:
      alerts:
        required_zones: steps
      detections:
        required_zones: steps
  second_floor_camera:
    mqtt:
      quality: 80
    ffmpeg:
      inputs:
        - path: 
            rtsp://homeassistant:homeassistant123@192.168.68.33:554/Streaming/Channels/201
          roles:
            - detect
    detect:
      width: 1920
      height: 1080
      fps: 10
    motion:
      threshold: 30
      contour_area: 50
      mask: 0.504,0,0.358,1,0,1,0,0
  entrance_camera:
    snapshots:
      enabled: false
    mqtt:
      quality: 70
    ffmpeg:
      inputs:
        - path: 
            rtsp://homeassistant:homeassistant123@192.168.68.33:554/Streaming/Channels/301
          roles:
            - detect
    detect:
      width: 1920
      height: 1080
      fps: 5
    motion:
      threshold: 30
      contour_area: 60
  driveway_camera:
    snapshots:
      enabled: false
    mqtt:
      quality: 70
    ffmpeg:
      inputs:
        - path: 
            rtsp://homeassistant:homeassistant123@192.168.68.33:554/Streaming/Channels/401
          roles:
            - detect
    detect:
      width: 1920
      height: 1080
      fps: 5
    motion:
      threshold: 30
      contour_area: 60
      mask: 0.277,0.079,0.02,0.077,0.019,0.055,0.28,0.052
detectors:
  coral:
    type: edgetpu
    device: usb
version: 0.15-1
semantic_search:
  enabled: true
  reindex: false
  model_size: small
