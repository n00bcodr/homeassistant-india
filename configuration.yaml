default_config:

homeassistant:
  packages: !include_dir_named packages/
  allowlist_external_dirs:
    - /config/.storage
    - /config/
    - /media/
  whitelist_external_dirs:
    - "/share"

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - !secret trusted_ip1
    - !secret trusted_ip2

frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    - /hacsfiles/custom-sidebar/custom-sidebar-yaml.js
    - /local/card-mod.js

delete:
logger:
  default: critical
  logs:
    custom_components.mediabrowser: debug
    # custom_components.hacs: debug
    homeassistant.components.http: warning

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
binary_sensor: !include binary_sensors.yaml
input_select: !include input_select.yaml
sensor: !include sensor.yaml
notify: !include notify.yaml
shell_command: !include shell_command.yaml
template: !include template.yaml
command_line: !include command_line.yaml
media_player: !include mediaplayer.yaml
wake_on_lan:
tts:
  - platform: google_translate
ffmpeg:
stream:
  ll_hls: true
  part_duration: 0.5
  segment_duration: 3



recorder:
  db_url: !secret recorder_db_url
  purge_keep_days: 5
  exclude:
    domains:
      - update
    entity_globs:
      - sensor.weather_*
      - sensor.sun*
      - sensor.moon*
      - sensor.count*
      - sensor.docker*
      - switch.docker*
      - button.docker*
      - device_tracker.smart*
      - device_tracker.tuya*
      - device_tracker.wiz*
      - device_tracker.sonoff*
    entities:
      - sun.sun
      - sensor.f1_season_results



climate:
  - platform: smartir
    name: Den AC
    unique_id: den_ac
    device_code: 3080
    controller_data:
      controller_type: Broadlink
      remote_entity: remote.rm4_remote
      delay_secs: 0.5
      num_repeats: 1
    temperature_sensor: sensor.rm4_temperature
    humidity_sensor: sensor.rm4_humidity