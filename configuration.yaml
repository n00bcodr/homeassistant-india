default_config:

homeassistant:
  packages: !include_dir_named packages/
  allowlist_external_dirs:
    - /config/.storage
    - /config/
    - /media/
  whitelist_external_dirs:
    - "/share"
  # external_url: !secret external_url
  # internal_url: "http://192.168.68.168:8123"

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - !secret trusted_ip

logger:
  default: critical
  logs:
   homeassistant.components.http: warning
   homeassistant.custom_components.tplink_router: debug

ffmpeg:

stream:
  ll_hls: true
  part_duration: 0.5
  segment_duration: 3

folder_watcher:
  - folder: /config/.storage

tts:
  - platform: google_translate

wake_on_lan:

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
binary_sensor: !include binary_sensors.yaml
input_select: !include input_select.yaml
sensor: !include sensor.yaml
notify: !include notify.yaml
template: !include template.yaml
command_line: !include command_line.yaml

frontend:
  themes: !include_dir_merge_named themes

monitor_docker:
  - name: Docker
    url: http://192.168.68.168:2375
    switchname: "Monitor Docker {name}"
    sensorname: "Monitor Docker {name} {sensor}"
    buttonenabled: True
    rename_entity: True
    containers:
      - broadlinkmanager
      - portainer
      - addon_core_samba
      - addon_6b87c29e_speedtest_addon
    rename:
      wtchtowerrr: WatchTower
      broadlinkmanager: Broadlink Manager
      portainer: Portainer
      addon_core_samba: Samba
      addon_6b87c29e_speedtest_addon: SpeedTest Addon
    monitored_conditions:
      - version
      - containers_running
      - containers_total
      - state
      - status
      - memory
      - containers_cpu_percentage
      - containers_1cpu_percentage
      - cpu_percentage
      - 1cpu_percentage
      - allinone

#mariadb config
recorder:
  db_url: !secret recorder_db_url
  purge_keep_days: 5
  exclude:
    domains:
      - update
    entity_globs:
      - sensor.weather_*
      - sensor.time_date
      - sensor.sun*
      - sensor.moon*
      - sensor.count*
      - sensor.f1_*
      - sensor.docker*
      - switch.docker*
      - button.docker*
      - device_tracker.smart*
      - device_tracker.tuya*
      - device_tracker.wiz*
      - device_tracker.sonoff*
    entities:
      - sun.sun
      - sensor.f1_season_results

shell_command:
  lovelace_default_convert: python /config/tools/lovelace_default_convert.py
  lovelace_wallmount_convert: python /config/tools/lovelace_wallmount_convert.py
  git_core_update_push: bash /config/tools/git_core_update_push.sh
  git_commit_push: bash /config/tools/ha_gitpush.sh "{{states.input_text.git_commit_message.state}}"
  git_hacs_update: bash /config/tools/hacs_updates_push.sh
